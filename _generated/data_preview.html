<script>
(function() {
  var g = document.currentScript.parentNode.querySelector(".preview-gallery");
  if (!g) return;
  var tabs = g.querySelectorAll(".tabs li");
  var panels = g.querySelectorAll(".preview-panel");
  tabs.forEach(function(tab) {
    tab.querySelector("a").addEventListener("click", function(e) {
      e.preventDefault();
      var target = tab.querySelector("a").getAttribute("data-preview");
      tabs.forEach(function(t) { t.classList.remove("is-active"); });
      tab.classList.add("is-active");
      panels.forEach(function(p) {
        var on = p.getAttribute("data-preview") === target;
        p.style.display = on ? "" : "none";
        var v = p.querySelector("video");
        if (v) { if (on) { v.play().catch(function(){}); } else { v.pause(); } }
      });
    });
  });
})();
</script>
